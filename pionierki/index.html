<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Pionierki Profilaktyki - szablon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Dodaj swoje zdjęcie do szablonu!</h2>
    <input type="file" id="upload" accept="image/*" style="display:none;">
    <label class="button" for="upload">Wybierz zdjęcie</label>
    <canvas id="canvas" width="768" height="768"></canvas>
    <button id="download" disabled>Pobierz</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
